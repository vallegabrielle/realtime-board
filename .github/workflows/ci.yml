name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: realtime_board
          POSTGRES_PASSWORD: realtime_board
          POSTGRES_DB: realtime_board
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U realtime_board -d realtime_board"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:push
        env:
          DATABASE_URL: postgresql://realtime_board:realtime_board@localhost:5432/realtime_board
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://realtime_board:realtime_board@localhost:5432/realtime_board
          BETTER_AUTH_SECRET: ci-secret-at-least-thirty-two-characters-long
          BETTER_AUTH_URL: http://localhost:3000
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          CI: true
          DATABASE_URL: postgresql://realtime_board:realtime_board@localhost:5432/realtime_board
          BETTER_AUTH_SECRET: ci-secret-at-least-thirty-two-characters-long
          BETTER_AUTH_URL: http://localhost:3000
