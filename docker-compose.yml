services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: realtime_board
      POSTGRES_USER: realtime_board
      POSTGRES_PASSWORD: realtime_board
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtime_board -d realtime_board"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
